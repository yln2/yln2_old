<style>.tb{display:inline-block;margin:auto;padding:0.55em;font-size:1.2em;font-family:d2coding;resize:none;}h2{font-family:d2coding;}div{display:inline;}.nw{width:100em;width:100ch;height:120%;display:table;font-size:1.2em;font-family:d2coding;resize:none;word-break:break-all;}input,textarea{font-family:d2coding;width:100em;width:100ch;}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<body style='width:95%;height:100%;'>
<h2 class="ls">yln2_old</h2>
<textarea class="tb"id="nn"rows="8"cols="96"placeholder="input"autocomplete="off"></textarea></textarea>
<input class="tb"id="ki"placeholder="key"autocomplete="off"size=85><br>
<button class="tb"onclick="aen()">Encode</button>
<button class="tb"onclick="ade()">Decode</button><br>
<textarea class="tb"id="ut"rows="8"cols="96"placeholder="output"autocomplete="off"></textarea>
<script>
function ge(a){return document.getElementById(a)}
function ab(a){return CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(a))}
function ba(a){return CryptoJS.enc.Utf8.stringify(a)}
function aen(){ge("ut").value=CryptoJS.AES.encrypt(ge("nn").value,CryptoJS.SHA256(ge("ki").value),{mode:CryptoJS.mode.ECB})}
function ade(){ge("ut").value=ba(CryptoJS.AES.decrypt(ge("nn").value,CryptoJS.SHA256(ge("ki").value),{mode:CryptoJS.mode.ECB}))}
</script>
</body>
